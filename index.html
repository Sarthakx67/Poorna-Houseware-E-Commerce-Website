    <title>Poorna Houseware B2B Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#c53030', // Red-700
                'primary-hover': '#9b2c2c', // Red-800
                secondary: '#4a5568', // Gray-700
                'secondary-hover': '#2d3748', // Gray-800
                light: '#f7fafc',     // Gray-100
                dark: '#1a202c',      // Gray-900
              },
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(1rem)' },

              fadeIn: {

                '100%': { opacity: '1' },
              }
            },
            animation: {
              fadeInUp: 'fadeInUp 0.5s ease-out forwards',
              fadeIn: 'fadeIn 0.5s ease-in-out forwards',
            },
          },
        },
      }
    </script>
